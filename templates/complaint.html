<!DOCTYPE html>
<html>
<head>
    <title>Smart Campus - Report Complaint</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🏫 Smart Campus
    </div>

    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/login">Logout</a>
    </div>

</nav>

<div class="container">

    <div class="form-card">

        <h2>📝 Report a Campus Problem</h2>

        <p style="color:#78909c; margin-bottom:25px;">
            Provide details about the problem so the maintenance team
            can resolve it quickly.
        </p>

        <form method="POST">

            <div class="form-group">

                <label>Complaint Title</label>

                <input
                    type="text"
                    name="title"
                    placeholder="Example: Classroom fan not working"
                    required>

            </div>

            <div class="form-group">

                <label>Category</label>

                <select name="category" required>

                    <option value="">Select Category</option>
                    <option value="Electrical">⚡ Electrical</option>
                    <option value="Water">💧 Water</option>
                    <option value="Internet">🌐 Internet</option>
                    <option value="Cleaning">🧹 Cleaning</option>
                    <option value="Furniture">🪑 Furniture</option>
                    <option value="Classroom">🏫 Classroom</option>
                    <option value="Laboratory">🔬 Laboratory</option>
                    <option value="Other">📌 Other</option>

                </select>

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea
                    name="description"
                    placeholder="Describe the problem in detail..."
                    required></textarea>

            </div>

            <div class="form-group">

                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    placeholder="Example: Block A - Room 203"
                    required>

            </div>

            <div class="form-group">

                <label>Priority</label>

                <select name="priority" required>

                    <option value="">Select Priority</option>
                    <option value="Low">🟢 Low</option>
                    <option value="Medium">🟡 Medium</option>
                    <option value="High">🔴 High</option>

                </select>

            </div>

            <button type="submit">
                Submit Complaint
            </button>

            <a href="/dashboard" class="btn"
               style="background:#78909c; margin-left:8px;">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
